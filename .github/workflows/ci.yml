name: ci-fast

# FAST STAGE (INV-CI-COST-CUT): guards + typecheck only, on every push.
# The full test suite lives in ci-full.yml and runs only on workflow_dispatch
# (batch head) or pull requests. Deploy to Oracle watches ci-full, never this
# workflow, so a fast-green push can never auto-deploy untested code.
# Path filtering: a backend-only change skips the frontend job and vice
# versa; docs-only changes skip both code jobs. The API-contracts check
# (qa:contracts) lives in the frontend job, so it still runs on every
# frontend-only change even though the backend job is skipped. If the
# changed-file detection cannot determine a base (first push, force-push),
# both jobs run (fail-closed). No third-party filter action is used: the
# `changes` job below is plain git, so there is no new supply-chain
# dependency to review.
# v2 (2026-11-08, base 0f7f82b): regenerated against the sequential ci.yml
# (0531150). The sequential fail-fast lives in ci-full, not here: both fast
# jobs are cheap (~4m) and run in parallel for the fastest signal. The
# frontend-fast job runs typecheck FIRST, mirroring 0531150's build-first
# fail-fast (a type error fails the job in ~1-2m instead of after the guards).

on:
  push:
    branches:
      - main
      - fix/cross-module-accounting-inventory-20261025
      - fix/p0c-safe-main-integration
      - fix/foundation-kernel-p0p1
      - fix/foundation-final-integration
      - fix/erp-final-system-validation
      - fix/erp-customer-release-gates
      - merge/erp-release-safe
  pull_request:
    branches:
      - main

concurrency:
  # Only superseded development-branch push runs may be cancelled.
  # Main pushes, PR checks and Oracle production deploys are never cancelled here.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          base='${{ github.event.before }}'
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'base commit unknown (first or force push) - running both sides'
            echo 'backend=true' >> "$GITHUB_OUTPUT"
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" '${{ github.sha }}')
          backend='false'
          frontend='false'
          if printf '%s\n' "$files" | grep -Eq '^(backend/|ARCHITECTURE_INVARIANTS\.md$|docs/ENGINE_MAP\.md$|package\.json$|\.github/workflows/ci(-full)?\.yml$)'; then
            backend='true'
          fi
          if printf '%s\n' "$files" | grep -Eq '^(frontend/|releases/|package\.json$|\.github/workflows/ci(-full)?\.yml$)'; then
            frontend='true'
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend-fast:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name != 'push' }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_MODE: CLOUD_SAAS
      PLATFORM_TENANT_ID: default
      TENANT_ID: default
      ACCOUNT_ID: default
      APP_HOST: 127.0.0.1
      APP_PORT: 3001
      LOG_LEVEL: warn
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: zsdb
      DATABASE_USER: zs
      DATABASE_PASSWORD: zs
      DATABASE_SCHEMA: public
      DATABASE_SSL: 'false'
      DATABASE_LOGGING: 'false'
      ENABLE_BOOTSTRAP_ADMIN: 'true'
      ALLOW_BOOTSTRAP_ADMIN_IN_PRODUCTION: 'false'
      DEFAULT_ADMIN_USERNAME: owner
      DEFAULT_ADMIN_PASSWORD: OwnerBootstrap2026!
      SESSION_COOKIE_NAME: 'zs_cloud_session'
      SESSION_CSRF_COOKIE_NAME: 'zs_cloud_csrf_token'
      SESSION_COOKIE_SECURE: 'false'
      SESSION_COOKIE_SAME_SITE: lax
      SESSION_CSRF_SECRET: ci-csrf-secret-0123456789
      ALLOW_SESSION_ID_HEADER: 'false'
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_LOCKOUT_MINUTES: 15
      CORS_ORIGINS: http://127.0.0.1:5173
      LOGIN_RATE_LIMIT_MAX: 100
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: 600
      AUTH_BURST_RATE_LIMIT_MAX: 60
      AUTH_BURST_RATE_LIMIT_WINDOW_SECONDS: 60
      BUSINESS_TIMEZONE: UTC
      E2E_BASE_URL: http://127.0.0.1:3001
      E2E_USERNAME: owner
      E2E_PASSWORD: OwnerBootstrap2026!
      MAIL_DELIVERY_MODE: console
      PUBLIC_TRIAL_DEBUG_CREDENTIALS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Backend typecheck and release gate
        run: |
          npm run build
          npm run typecheck
          npm run check:readiness
          npm run check:permissions
          npm run check:env-safety
        working-directory: backend
      - name: Architecture guard (invariants tail)
        run: npx ts-node test/critical/architecture-guard.spec.ts
        working-directory: backend

  frontend-fast:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name != 'push' }}
    runs-on: ubuntu-latest
    # CI runner Node heap (~2 GB) is too small for this frontend's `tsc -b`:
    # the build dies with "JavaScript heap out of memory", exit 134, while
    # the same build passes on a dev machine in 43 s. Raise the heap for
    # this job only -- local builds are fine without it. If CI still OOMs,
    # raise to 6144/8192; do not change frontend code for a runner limit.
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      # Fail-fast (mirrors 0531150): typecheck runs FIRST, before the guards.
      # A type error fails the job in ~1-2m instead of after the guards.
      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Frontend architecture and contract guards
        run: |
          npm run qa:functional
          npm run qa:api
          npm run qa:contracts
          npm run qa:routes
          npm run qa:composition
          npm run qa:architecture
        working-directory: frontend
