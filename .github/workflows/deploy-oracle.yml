name: Deploy to Oracle SaaS Server

# البناء يتم هنا على GitHub وليس على سيرفر الإنتاج: السيرفر نواة واحدة، وبناء
# الباك إند والفرونت إند عليه كان يجمّد الكاشيرات لدقائق مع كل نشر، وكان
# `rm -rf dist` قبل البناء يُسقط الباك إند طوال مدة البناء (1754 إعادة تشغيل
# فاشلة مسجلة في PM2 بسبب اختفاء dist/main.js).
#
# السيرفر يستلم ملفاً جاهزاً، يشغّل الهجرات، ثم يبدّل المجلدات دفعة واحدة.
# إن فشل فحص الصحة بعد التبديل يرجع تلقائياً للنسخة السابقة.

on:
  workflow_run:
    workflows: ["ci-full"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-oracle-saas
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build on GitHub and deploy to Oracle Cloud VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Auto-deploy gate (INV-AUTO-DEPLOY): a green ci-full run deploys its exact
    # SHA automatically, whether ci-full was triggered by a push to main or by
    # a manual dispatch. A red ci-full never deploys: conclusion must be
    # 'success', the run must be on main, in this repo, on this exact SHA.
    # ci-fast alone never deploys — this job watches ci-full only.
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'push') && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Require current main SHA with successful full CI
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$CURRENT_MAIN" = "$DEPLOY_SHA" || { echo "::error::Main advanced after dispatch; start a new approved deployment"; exit 1; }
          PASSED=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-full.yml/runs?head_sha=$DEPLOY_SHA&per_page=100" \
            --jq ".workflow_runs | map(select(.head_sha == \"$DEPLOY_SHA\" and .head_branch == \"main\" and (.event == \"workflow_dispatch\" or .event == \"push\") and .conclusion == \"success\")) | length")
          test "$PASSED" -ge 1 || { echo "::error::Exact main commit has no successful full-CI run (push or dispatch); refusing deployment"; exit 1; }

      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          test -f dist/main.js

      - name: Build frontend
        working-directory: frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          VITE_CSRF_COOKIE_NAME: ${{ vars.VITE_CSRF_COOKIE_NAME || 'zs_cloud_csrf_token' }}
          VITE_PLATFORM_TENANT_ID: ${{ vars.VITE_PLATFORM_TENANT_ID || 'zsystems-main' }}
          # SF-10: set to the root domain (e.g. zsystemai.com) only after wildcard DNS + nginx are live;
          # must match STOREFRONT_ROOT_DOMAIN in backend/.env. Empty = stores stay on /st/<slug>.
          VITE_STOREFRONT_ROOT_DOMAIN: ${{ vars.VITE_STOREFRONT_ROOT_DOMAIN || '' }}
          # Sentry (INV-SENTRY-LIVE-ENABLEMENT): Vite inlines import.meta.env at build time, so the
          # frontend DSN must be supplied HERE — a DSN added later on the server can never reach the
          # shipped bundle. Flag from vars (boolean), DSN from secrets (masked in logs). Both empty
          # by default: tracking stays off until a Sentry project exists and both are set.
          VITE_ERROR_TRACKING_ENABLED: ${{ vars.VITE_ERROR_TRACKING_ENABLED || 'false' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || '' }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Package release
        run: |
          tar -czf release.tgz backend/dist frontend/dist
          ls -lh release.tgz

      - name: Upload release to server
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          ORACLE_HOST: ${{ secrets.ORACLE_HOST || '92.5.178.54' }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          test -n "$ORACLE_SSH_KNOWN_HOSTS"
          echo "$ORACLE_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          scp -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -P "$ORACLE_PORT" \
            release.tgz "$ORACLE_USER@$ORACLE_HOST:/tmp/zsystems-release-$DEPLOY_SHA.tgz"

      - name: Migrate, swap and reload on server
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST || '92.5.178.54' }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'ubuntu' }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT || '22' }}
        run: |
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p "$ORACLE_PORT" "$ORACLE_USER@$ORACLE_HOST" \
            "DEPLOY_SHA=$DEPLOY_SHA bash -s" << 'REMOTE'
          set -euo pipefail
          echo "Deploying $DEPLOY_SHA at $(date)"

          TARGET_DIR="/var/www/zsystems/app"
          [ -d "$TARGET_DIR" ] || TARGET_DIR="/var/www/zsystems"
          RELEASE_TGZ="/tmp/zsystems-release-$DEPLOY_SHA.tgz"
          STAGE_DIR="/var/www/zsystems/.deploy-stage"
          cd "$TARGET_DIR"

          echo "=== 1. Source update (needed for migrations) ==="
          git config --global --add safe.directory "$TARGET_DIR" 2>/dev/null || true
          git fetch origin main
          git reset --hard "$DEPLOY_SHA"

          echo "=== 2. Backend dependencies (only when the lockfile changed) ==="
          cd "$TARGET_DIR/backend"
          LOCK_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [ ! -d node_modules ] || [ "$(cat node_modules/.zs-lock-hash 2>/dev/null || true)" != "$LOCK_HASH" ]; then
            npm ci --no-audit --no-fund
            echo "$LOCK_HASH" > node_modules/.zs-lock-hash
          else
            echo "package-lock.json unchanged - skipping npm ci"
          fi

          echo "=== 3. Unpack prebuilt release ==="
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          tar -xzf "$RELEASE_TGZ" -C "$STAGE_DIR"
          test -f "$STAGE_DIR/backend/dist/main.js"
          test -f "$STAGE_DIR/frontend/dist/index.html"

          echo "=== 4. Encrypted pre-migration backup ==="
          test -s /etc/zsystems/backup-passphrase
          bash "$TARGET_DIR/deploy/scripts/zsystems-backup.sh" hourly

          echo "=== 4b. Record pre-deploy schema state (for the failure trap) ==="
          # Kysely runs a whole `migration:run` batch in ONE transaction (kysely
          # 0.28 Migrator wraps the run when the adapter supports transactional
          # DDL, and this repo never sets disableTransactions), so a failed
          # migrate normally leaves nothing applied. The trap below still
          # verifies that instead of assuming it: a migration that escapes the
          # transaction, or a healthy migrate followed by an unhealthy build,
          # is what the revert loop and the backup restore are for.
          PRE_MIGRATIONS_FILE="/tmp/zsystems-pre-deploy-migrations-$DEPLOY_SHA.txt"
          if ! npm run --silent migration:list > "$PRE_MIGRATIONS_FILE" 2>/dev/null; then
            echo "Cannot list migrations - refusing to deploy without a known pre-deploy schema"
            exit 1
          fi
          PRE_MIGRATION_COUNT=$(grep -c ': applied$' "$PRE_MIGRATIONS_FILE" || true)
          if [ "${PRE_MIGRATION_COUNT:-0}" -le 0 ]; then
            echo "Pre-deploy migration list is empty - refusing to deploy without a known pre-deploy schema"
            exit 1
          fi
          echo "Pre-deploy applied migrations: $PRE_MIGRATION_COUNT"
          # The step-4 backup is the restore source of last resort. It must be
          # the file this deploy just took, not an older one.
          # sort must not write into a pipe read by `head -1`: head exits
          # after the first line, sort gets SIGPIPE on its next write, and
          # under `set -euo pipefail` the deploy dies with 141 (deploy #186).
          # sort writes to a file instead; head reads the file.
          HOURLY_BACKUP_LIST=$(mktemp /tmp/zs-hourly-backup-list-XXXXXX)
          find /var/backups/zsystems -maxdepth 1 -type f -name 'zsystems_hourly_*.sql.gz.enc' -printf '%T@ %p\n' 2>/dev/null | sort -nr > "$HOURLY_BACKUP_LIST"
          HOURLY_BACKUP=$(head -1 "$HOURLY_BACKUP_LIST" | cut -d' ' -f2-)
          rm -f "$HOURLY_BACKUP_LIST"
          if [ -z "$HOURLY_BACKUP" ] || [ ! -r "$HOURLY_BACKUP" ]; then
            echo "No readable hourly backup from step 4 - refusing to deploy without a restore source"
            exit 1
          fi
          echo "Restore source if the schema cannot be reverted: $HOURLY_BACKUP"

          # --- Failure trap: bring the database back to the pre-deploy schema ---
          # NOTE: the helpers below never spell out the step-6 reload command
          # literally (they use $BACKEND_PM2_NAME): the deploy guard pins the
          # step-6 reload to its position after the folder swap, and a second
          # literal occurrence would move that pin.
          BACKEND_PM2_NAME="zsystems-backend"

          applied_migration_count() {
            # Prints the applied count, or nothing when the list cannot be read
            # (callers must treat "no number" as "state unknown", never as 0:
            # 0 would make the revert loop try to undo every migration).
            local list_output count
            list_output=$(npm run --silent migration:list 2>/dev/null) || return 1
            [ -n "$list_output" ] || return 1
            count=$(printf '%s\n' "$list_output" | grep -c ': applied$' || true)
            printf '%s\n' "$count"
          }

          restart_backend() {
            # Same start-or-reload decision as step 6, usable after a rollback
            # that may have stopped the backend (the restore path does).
            # `pm2 reload` on a stopped process fails, so it falls through to
            # `pm2 restart`, which starts a stopped process.
            local env_file=""
            for f in "$TARGET_DIR/backend/.env" "$TARGET_DIR/.env" "/var/www/zsystems/.env"; do
              if [ -f "$f" ]; then env_file="$f"; break; fi
            done
            if pm2 describe "$BACKEND_PM2_NAME" > /dev/null 2>&1; then
              pm2 reload "$BACKEND_PM2_NAME" --update-env || pm2 restart "$BACKEND_PM2_NAME" --update-env || true
            elif [ -n "$env_file" ]; then
              pm2 start dist/main.js --name "$BACKEND_PM2_NAME" --cwd "$TARGET_DIR/backend" --node-args="--env-file=$env_file" || true
            else
              pm2 start dist/main.js --name "$BACKEND_PM2_NAME" --cwd "$TARGET_DIR/backend" || true
            fi
          }

          revert_migrations_to_pre_deploy() {
            # Undoes, one `down` per migration, until the applied list is the
            # pre-deploy list again. Returns:
            #   0 — schema is back at the pre-deploy list
            #   1 — schema is verified ahead AND the revert cannot proceed
            #       (a failed `down`, or a migration without a `down`: Kysely's
            #       migrateDown silently skips it and still exits 0, so the
            #       applied count not dropping is the only signal) — the caller
            #       must fall back to the backup restore
            #   2 — the schema state cannot be read at all — the caller must
            #       NOT restore on an unverified state (dropping the database
            #       on a guess loses data); it must alert and stop instead
            local current next attempts=0
            current=$(applied_migration_count) || return 2
            while [ "$current" -gt "$PRE_MIGRATION_COUNT" ] && [ "$attempts" -lt 100 ]; do
              attempts=$((attempts + 1))
              echo "Reverting one migration (applied $current, pre-deploy $PRE_MIGRATION_COUNT, attempt $attempts)..."
              if ! npm run migration:revert; then
                echo "migration:revert failed - falling back to backup restore"
                return 1
              fi
              next=$(applied_migration_count) || return 2
              if [ "$next" -ge "$current" ]; then
                echo "migration:revert did not reduce the applied count ($current -> $next) - the last migration has no down step; falling back to backup restore"
                return 1
              fi
              current="$next"
            done
            if [ "$current" -eq "$PRE_MIGRATION_COUNT" ]; then
              echo "Schema is back at the pre-deploy migration list ($PRE_MIGRATION_COUNT applied)"
              return 0
            fi
            echo "Revert loop stopped with $current applied migrations (pre-deploy $PRE_MIGRATION_COUNT) - falling back to backup restore"
            return 1
          }

          restore_database_from_hourly_backup() {
            # LAST RESORT ONLY: drops the live database and restores the step-4
            # hourly dump. Everything written after the backup is lost (hourly
            # RPO: up to one hour of data), so this runs only when the revert
            # loop demonstrably cannot restore the pre-deploy list.
            # zsystems-restore.sh cannot do this: it only restores daily
            # bundles, and its `full` mode refuses a non-empty database. The
            # decrypt + verify + restore steps below are the recipe proven by
            # the weekly restore drill (zsystems-restore-drill.sh §2-§3).
            local work_dir sql_gz restore_log errors restored_count
            [ -n "${HOURLY_BACKUP:-}" ] && [ -r "$HOURLY_BACKUP" ] || { echo "No hourly backup file to restore from"; return 1; }
            work_dir=$(mktemp -d /tmp/zs-deploy-restore-XXXXXX) || return 1
            sql_gz="$work_dir/dump.sql.gz"
            restore_log="$work_dir/restore.log"
            echo "Restoring the database from hourly backup $(basename "$HOURLY_BACKUP") - data written after the backup is lost"
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -in "$HOURLY_BACKUP" -out "$sql_gz" -pass "file:/etc/zsystems/backup-passphrase"; then
              echo "Failed to decrypt the hourly backup - manual recovery needed (docs/DISASTER_RECOVERY.md)"
              rm -rf "$work_dir"
              return 1
            fi
            if ! gzip -cd "$sql_gz" | tail -n 5 | grep -q "PostgreSQL database dump complete"; then
              echo "Hourly backup is truncated - refusing to restore it; manual recovery needed"
              rm -rf "$work_dir"
              return 1
            fi
            pm2 stop "$BACKEND_PM2_NAME" || true
            sudo docker exec zsystems-postgres psql -U postgres -d postgres -q -c "DROP DATABASE IF EXISTS zsystems_db WITH (FORCE)" || { echo "Failed to drop the live database - manual recovery needed"; restart_backend; rm -rf "$work_dir"; return 1; }
            sudo docker exec zsystems-postgres psql -U postgres -d postgres -q -c "CREATE DATABASE zsystems_db" || { echo "Failed to recreate the live database - manual recovery needed"; restart_backend; rm -rf "$work_dir"; return 1; }
            gzip -cd "$sql_gz" | sudo docker exec -i zsystems-postgres psql -U postgres -d zsystems_db -q > "$restore_log" 2>&1 || true
            errors=$(grep -c "^ERROR" "$restore_log" || true)
            if [ "${errors:-0}" -gt 0 ]; then
              echo "Restore finished with $errors ERROR lines - first: $(grep -m1 -A1 '^ERROR' "$restore_log" | tr '\n' ' ' | cut -c1-300)"
              restart_backend
              rm -rf "$work_dir"
              return 1
            fi
            restored_count=$(applied_migration_count) || { echo "Restored the backup but cannot verify the migration list - manual check needed"; restart_backend; rm -rf "$work_dir"; return 1; }
            rm -rf "$work_dir"
            if [ "$restored_count" -ne "$PRE_MIGRATION_COUNT" ]; then
              echo "Restored backup has $restored_count applied migrations, expected pre-deploy $PRE_MIGRATION_COUNT - manual check needed"
              restart_backend
              return 1
            fi
            echo "Database restored from the hourly backup ($PRE_MIGRATION_COUNT applied migrations)"
            restart_backend
            return 0
          }

          restore_db_to_pre_deploy() {
            # One decision for both failure modes (failed migrate, failed
            # health check): revert first, restore only when revert cannot.
            # Returns 0 when the schema is back at the pre-deploy list.
            local rc=0
            revert_migrations_to_pre_deploy || rc=$?
            if [ "$rc" -eq 0 ]; then return 0; fi
            if [ "$rc" -eq 2 ]; then
              echo "WARNING: cannot read the migration list - NOT restoring on an unverified state; manual recovery needed"
              return 2
            fi
            restore_database_from_hourly_backup
          }

          echo "=== 5. Database migrations (before the new code goes live) ==="
          if ! npm run migration:run; then
            echo "Migration failed - restoring the database to the pre-deploy schema"
            if ! restore_db_to_pre_deploy; then
              echo "WARNING: the database could not be brought back to the pre-deploy schema - manual recovery needed (docs/DISASTER_RECOVERY.md)"
            fi
            exit 1
          fi

          echo "=== 6. Swap in the new build ==="
          swap_in() {
            local live="$1" fresh="$2"
            rm -rf "$live.prev"
            if [ -d "$live" ]; then mv "$live" "$live.prev"; fi
            mv "$fresh" "$live"
          }
          swap_back() {
            local live="$1"
            if [ -d "$live.prev" ]; then rm -rf "$live"; mv "$live.prev" "$live"; fi
          }
          swap_in "$TARGET_DIR/backend/dist" "$STAGE_DIR/backend/dist"
          swap_in "$TARGET_DIR/frontend/dist" "$STAGE_DIR/frontend/dist"

          echo "=== 6. Reload backend ==="
          ENV_FILE=""
          for f in "$TARGET_DIR/backend/.env" "$TARGET_DIR/.env" "/var/www/zsystems/.env"; do
            if [ -f "$f" ]; then ENV_FILE="$f"; break; fi
          done
          if pm2 describe zsystems-backend > /dev/null 2>&1; then
            pm2 reload zsystems-backend --update-env
          elif [ -n "$ENV_FILE" ]; then
            pm2 start dist/main.js --name zsystems-backend --cwd "$TARGET_DIR/backend" --node-args="--env-file=$ENV_FILE"
          else
            pm2 start dist/main.js --name zsystems-backend --cwd "$TARGET_DIR/backend"
          fi

          echo "=== 7. Health check ==="
          check_health() {
            for i in $(seq 1 20); do
              sleep 3
              LIVE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health/live || true)
              READY=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/health/ready || true)
              echo "Probe #$i -> live: $LIVE, ready: $READY"
              if [ "$LIVE" = "200" ] && [ "$READY" = "200" ]; then return 0; fi
            done
            return 1
          }

          if ! check_health; then
            echo "New build is unhealthy - rolling back to the previous build"
            pm2 logs zsystems-backend --nostream --lines 50 || true
            swap_back "$TARGET_DIR/backend/dist"
            swap_back "$TARGET_DIR/frontend/dist"
            # Folder-only rollback is not enough: the migrations already ran,
            # so the old build would run against the new schema. Bring the
            # database back to the pre-deploy list first, then re-check.
            if ! restore_db_to_pre_deploy; then
              echo "WARNING: the database could not be brought back to the pre-deploy schema - the old build is running against the new schema; manual recovery needed (docs/DISASTER_RECOVERY.md)"
            fi
            restart_backend
            check_health || echo "WARNING: previous build is not healthy either"
            exit 1
          fi

          pm2 save || true
          rm -rf "$STAGE_DIR" "$RELEASE_TGZ"
          if [ -f "$TARGET_DIR/deploy/nginx/zsystemai-subdomains.conf" ] && [ -f /etc/nginx/sites-available/zsystemai-subdomains ]; then
            sudo cp "$TARGET_DIR/deploy/nginx/zsystemai-subdomains.conf" /etc/nginx/sites-available/zsystemai-subdomains 2>/dev/null || true
            sudo nginx -t 2>/dev/null && sudo systemctl reload nginx 2>/dev/null || true
          else
            sudo systemctl reload nginx 2>/dev/null || true
          fi
          echo "Deployed $DEPLOY_SHA successfully"
          REMOTE

      # Telegram is for critical alerts only: a failed or rolled-back deploy can mean production is
      # affected. Successful deploys are visible in GitHub and would only flood the chat.
      - name: Send Telegram Deployment Notification
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            if [ "$DEPLOY_STATUS" = "success" ]; then
              TEXT="🚀 *Z-Systems Deployment Succeeded!*%0A━━━━━━━━━━━━━━━━━%0A*Server:* Oracle Cloud VPS%0A*Branch:* main%0A*Commit:* \`${DEPLOY_SHA}\`%0A*Author:* ${{ github.actor }}%0A*Status:* 🟢 Production Live & Healthy"
            else
              TEXT="🚨 *Z-Systems Deployment Alert!*%0A━━━━━━━━━━━━━━━━━%0A*Server:* Oracle Cloud VPS%0A*Branch:* main%0A*Commit:* \`${DEPLOY_SHA}\`%0A*Status:* 🔴 Deployment Failed or Rolled Back"
            fi
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${TEXT}" \
              -d "parse_mode=Markdown" || true
          fi
